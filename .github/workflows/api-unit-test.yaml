name: api-unit-test

on:
  pull_request:
    branches:
      - development
      - master
    paths:
      - 'api/**'

jobs:
  test:
    name: Run API Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'api/requirements.txt'

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: api
        env:
          # Use SQLite for CI tests to avoid dependency on PostgreSQL
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ":memory:"
          # Dummy values for external integrations (should be mocked in tests)
          LIBRECHAT_MONGO_URI: mongodb://localhost:27017/LibreChat
          SECRET_KEY: ci_testing_secret_key
          DEBUG: "False"
          KEYCLOAK_SERVER_URL: http://localhost:8080
          KEYCLOAK_REALM: ayo
          KEYCLOAK_CLIENT_ID: admin-cli
          KEYCLOAK_ADMIN_USERNAME: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          DASHBOARD_URL: http://localhost:3000
          ALLOWED_HOSTS: "*"
        run: |
          pytest
