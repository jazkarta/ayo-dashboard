<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Silent SSO Check</title>
  </head>
  <body>
    <!--
      This page is opened by keycloak-js in a hidden iframe to silently check
      whether the user already has a valid Keycloak session.
      It must be served at: <your-app-origin>/silent-check-sso.html
      and must be whitelisted in Keycloak admin → Client → Valid Redirect URIs.
    -->
    <script>
      parent.postMessage(location.href, location.origin);
    </script>
  </body>
</html>
